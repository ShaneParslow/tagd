[package]
name = "tagd-image"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tagger-image"
path = "src/main.rs"

[dependencies]
tagd-core = { path = "../../tagd-core", features = ["runtime"] }

anyhow = "1.0"
# Only the container/header parsers are needed — this tagger never decodes
# pixels — so `rayon` and the heavier codecs stay off.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
