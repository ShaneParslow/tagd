[package]
name = "tagd-audio"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tagger-audio"
path = "src/main.rs"

[dependencies]
tagd-core = { path = "../../tagd-core", features = ["runtime"] }

anyhow = "1.0"
# Reads embedded metadata (ID3, Vorbis comments, MP4 atoms, ...) and stream
# properties without decoding any audio.
lofty = "0.24"
